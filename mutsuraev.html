<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТИМУР МУЦУРАЕВ / ДОТА ЭФИР</title>
    <style>
        :root { --mc-bg: #1c1d1a; --mc-card: #2b2c27; --mc-accent: #4e5a44; }
        body { margin: 0; padding: 0; height: 100vh; font-family: 'Arial Black', sans-serif; background: var(--mc-bg); color: #fff; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .main-container { display: flex; gap: 20px; width: 100%; max-width: 820px; padding: 20px; box-sizing: border-box; position: relative; }
        .player-container { padding: 2rem; border-radius: 2rem; width: 100%; max-width: 380px; text-align: center; position: relative; background: var(--mc-card); border: 3px solid var(--mc-accent); box-shadow: 0 20px 50px rgba(0,0,0,0.5); box-sizing: border-box; flex-shrink: 0; }
        .playlist-side { flex-grow: 1; background: var(--mc-card); border: 3px solid var(--mc-accent); border-radius: 2rem; padding: 1.5rem; height: 415px; box-sizing: border-box; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .playlist-title { font-size: 1.1rem; color: #c0c0c0; border-bottom: 2px solid var(--mc-accent); padding-bottom: 8px; margin-bottom: 10px; text-align: left; }
        .tracks-list { overflow-y: auto; flex-grow: 1; padding-right: 5px; }
        .tracks-list::-webkit-scrollbar { width: 6px; }
        .tracks-list::-webkit-scrollbar-track { background: #1f201c; }
        .tracks-list::-webkit-scrollbar-thumb { background: var(--mc-accent); border-radius: 3px; }
        .track-item { padding: 10px; background: #1f201c; margin-bottom: 6px; border-radius: 8px; cursor: pointer; text-align: left; font-family: sans-serif; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid transparent; }
        .track-item:hover { background: rgba(78, 90, 68, 0.4); border-color: var(--mc-accent); }
        .track-item.active { background: var(--mc-accent); color: #fff; font-weight: bold; border-color: #fff; }
        .back-btn { position: absolute; top: -45px; left: 20px; background: rgba(255,255,255,0.1); border: 1px solid #fff; color: #fff; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; text-decoration: none; }
        h1 { color: #c0c0c0; border-bottom: 2px solid var(--mc-accent); padding-bottom: 5px; margin: 0; font-size: 1.5rem; }
        .search-box { width: 100%; padding: 10px; margin-top: 15px; background: #1f201c; border: 1px solid var(--mc-accent); border-radius: 8px; color: #fff; font-family: sans-serif; font-size: 0.9rem; box-sizing: border-box; }
        .search-results { background: #1f201c; border: 1px solid var(--mc-accent); border-top: none; max-height: 150px; overflow-y: auto; text-align: left; display: none; position: absolute; width: 100%; z-index: 100; border-radius: 0 0 8px 8px; }
        .search-item { padding: 8px 12px; cursor: pointer; font-family: sans-serif; font-size: 0.85rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .search-item:hover { background: var(--mc-accent); }
        .now-playing { background: #1f201c; border: 1px solid var(--mc-accent); padding: 1rem; border-radius: 0.5rem; margin: 1.5rem 0; text-align: left; min-height: 45px; display: flex; align-items: center; }
        audio { width: 100%; accent-color: var(--mc-accent); filter: grayscale(0.5); }
        .nav-buttons { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; }
        .nav-buttons button { background: rgba(255,255,255,0.05); border: 1px solid #fff; color: #fff; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.95rem; }
        @media (max-width: 768px) {
            .main-container { flex-direction: column; overflow-y: auto; height: 100vh; justify-content: flex-start; padding-top: 60px; }
            .player-container { max-width: 100%; }
            .back-btn { top: 15px; }
        }
    </style>
    <!-- ПОДГРУЖАЕМ ТРЕКЛИСТ ИЗ ОТДЕЛЬНОГО ФАЙЛА -->
    <script src="tracks.js"></script>
</head>
<body>
    <div class="main-container">
        <a class="back-btn" href="index.html">↩ К выбору</a>
        <div class="player-container">
            <div style="font-size: 1.6rem; margin-bottom: 0.3rem; color: #7a8271;">🪖 Чеченская Гитара 🎸</div>
            <h1>ТИМУР МУЦУРАЕВ</h1>
            <div style="font-size: 0.7rem; color: #8a9680; font-style: italic; margin: 3px 0 5px 0;">Военный архив / 45 песен</div>
            <div style="position: relative; width: 100%;">
                <input type="text" class="search-box" id="search-input" placeholder="Поиск трека по названию...">
                <div class="search-results" id="search-results"></div>
            </div>
            <div class="now-playing">
                <span id="track-title" style="font-weight:bold; font-size:1rem; display:block; color:#fff;">Загрузка трека...</span>
            </div>
            <div class="nav-buttons">
                <button id="btn-prev">⏮ Назад</button>
                <button id="btn-next">Вперед ⏭</button>
            </div>
            <audio id="audio-player" controls></audio>
            <div style="margin-top:1.2rem; font-size:1rem; color: #4e5a44; letter-spacing:2px;">⚔️ Катка под гитару ⚔️</div>
        </div>
        <div class="playlist-side">
            <div class="playlist-title">📜 Список всех треков:</div>
            <div class="tracks-list" id="playlist-container"></div>
        </div>
    </div>
<script>
    let currentIndex = 0;
    const audio = document.getElementById('audio-player');
    const titleEl = document.getElementById('track-title');
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    const playlistContainer = document.getElementById('playlist-container');

    function buildPlaylistUI() {
        playlistContainer.innerHTML = '';
        playlist.forEach((track, idx) => {
            const item = document.createElement('div');
            item.className = 'track-item' + (idx === currentIndex ? ' active' : '');
            item.id = 'track-' + idx;
            item.textContent = (idx + 1) + ". " + track.title;
            item.onclick = function() { selectTrack(idx); };
            playlistContainer.appendChild(item);
        });
    }

    function selectTrack(index) {
        currentIndex = index; loadTrack(currentIndex); audio.play().catch(e => {});
        document.querySelectorAll('.track-item').forEach(el => el.classList.remove('active'));
        const activeItem = document.getElementById('track-' + index);
        if (activeItem) { activeItem.classList.add('active'); activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
    }

    function loadTrack(index) {
        if (playlist[index]) {
            audio.src = playlist[index].url;
            titleEl.textContent = playlist[index].title;
            document.querySelectorAll('.track-item').forEach(el => el.classList.remove('active'));
            const activeItem = document.getElementById('track-' + index);
            if (activeItem) { activeItem.classList.add('active'); activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
        }
    }

    function nextTrack() { currentIndex = (currentIndex + 1) % playlist.length; loadTrack(currentIndex); audio.play().catch(e => {}); }
    function prevTrack() { currentIndex = (currentIndex - 1 + playlist.length) % playlist.length; loadTrack(currentIndex); audio.play().catch(e => {}); }

    searchInput.addEventListener('input', function(e) {
        const query = e.target.value.toLowerCase().trim(); searchResults.innerHTML = '';
        if (!query) { searchResults.style.display = 'none'; return; }
        const filtered = playlist.map((t, idx) => ({...t, idx})).filter(t => t.title.toLowerCase().includes(query));
        if (filtered.length > 0) {
            filtered.forEach(track => {
                const div = document.createElement('div'); div.className = 'search-item'; div.textContent = track.title;
                div.onclick = function() { selectTrack(track.idx); searchResults.style.display = 'none'; searchInput.value = ''; };
                searchResults.appendChild(div);
            });
            searchResults.style.display = 'block';
        } else { searchResults.style.display = 'none'; }
    });

    document.addEventListener('click', function(e) { if (e.target !== searchInput) searchResults.style.display = 'none'; });
    document.getElementById('btn-next').addEventListener('click', nextTrack);
    document.getElementById('btn-prev').addEventListener('click', prevTrack);
    audio.addEventListener('ended', nextTrack);

    buildPlaylistUI();
    loadTrack(currentIndex);
</script>
</body>
</html>
